# hermes-gateway.service drop-in — 하네스 동결
#
# 설치 위치: /etc/systemd/system/hermes-gateway.service.d/10-readonly-harness.conf
# 적용:      sudo systemctl daemon-reload && sudo systemctl restart hermes-gateway
# 해제:      이 파일 삭제 후 위 두 명령 반복
#
# 게이트웨이와 그 자식 프로세스(= 에이전트의 terminal·write_file·patch 도구)에만
# 걸리는 마운트 네임스페이스다. 관리자가 ssh 로 `sudo -u hermes git pull` 하는
# 경로는 이 네임스페이스 밖이라 영향을 받지 않는다.
#
# 에이전트가 해제할 수 없다 — 유닛 파일 수정과 systemctl 은 root 권한이 필요하고,
# 본 유닛의 NoNewPrivileges=true 때문에 게이트웨이 하위에서는 sudo 가 동작하지 않는다.
#
# 동결하지 못하는 것: cron/jobs.json 은 스케줄러가 next_run_at·last_run_at 을
# 계속 써야 해서 읽기전용으로 만들 수 없다.
# [2026-08-07] 그 "별도 수단" 을 config.yaml 로 처리했다 — disabled_toolsets 에
# cronjob(등록 도구)과 terminal(파일 직접 편집 경로)이 둘 다 들어가 있어
# jobs.json 이 쓰기 가능해도 에이전트가 건드릴 수단이 없다.

[Service]
ReadOnlyPaths=/home/hermes/.hermes/config.yaml
ReadOnlyPaths=/home/hermes/.hermes/SOUL.md
ReadOnlyPaths=/home/hermes/.hermes/.env
ReadOnlyPaths=/home/hermes/.hermes/hooks
ReadOnlyPaths=/home/hermes/.hermes/scripts
ReadOnlyPaths=/home/hermes/.hermes/plugins
ReadOnlyPaths=/home/hermes/.hermes/skills
ReadOnlyPaths=/home/hermes/.hermes/memories
ReadOnlyPaths=/home/hermes/.hermes/hermes-agent
ReadOnlyPaths=/home/hermes/.hermes/.git
