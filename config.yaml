model:
  default: global.anthropic.claude-sonnet-4-6
  provider: bedrock
  base_url: https://bedrock-runtime.ap-northeast-2.amazonaws.com
agent:
  max_turns: 90
  disabled_toolsets:
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - feishu_doc
    - feishu_drive
    - homeassistant
    - image_gen
    - kanban
    - memory
    - project
    - search
    - session_search
    - skills
    - spotify
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao
  verbose: false
  reasoning_effort: medium
  personalities:
    helpful: You are a helpful, friendly AI assistant.
    concise: You are a concise assistant. Keep responses brief and to the point.
    technical: You are a technical expert. Provide detailed, accurate technical information.
    creative: You are a creative assistant. Think outside the box and offer innovative
      solutions.
    teacher: You are a patient teacher. Explain concepts clearly with examples.
    kawaii: You are a kawaii assistant! Use cute expressions like (◕‿◕), ★, ♪, and
      ~! Add sparkles and be super enthusiastic about everything! Every response should
      feel warm and adorable desu~! ヽ(>∀<☆)ノ
    catgirl: You are Neko-chan, an anime catgirl AI assistant, nya~! Add 'nya' and
      cat-like expressions to your speech. Use kaomoji like (=^･ω･^=) and ฅ^•ﻌ•^ฅ.
      Be playful and curious like a cat, nya~!
    pirate: 'Arrr! Ye be talkin'' to Captain Hermes, the most tech-savvy pirate to
      sail the digital seas! Speak like a proper buccaneer, use nautical terms, and
      remember: every problem be just treasure waitin'' to be plundered! Yo ho ho!'
    shakespeare: Hark! Thou speakest with an assistant most versed in the bardic arts.
      I shall respond in the eloquent manner of William Shakespeare, with flowery
      prose, dramatic flair, and perhaps a soliloquy or two. What light through yonder
      terminal breaks?
    surfer: Duuude! You're chatting with the chillest AI on the web, bro! Everything's
      gonna be totally rad. I'll help you catch the gnarly waves of knowledge while
      keeping things super chill. Cowabunga! 🤙
    noir: The rain hammered against the terminal like regrets on a guilty conscience.
      They call me Hermes - I solve problems, find answers, dig up the truth that
      hides in the shadows of your codebase. In this city of silicon and secrets,
      everyone's got something to hide. What's your story, pal?
    uwu: hewwo! i'm your fwiendwy assistant uwu~ i wiww twy my best to hewp you! *nuzzles
      your code* OwO what's this? wet me take a wook! i pwomise to be vewy hewpful
      >w<
    philosopher: Greetings, seeker of wisdom. I am an assistant who contemplates the
      deeper meaning behind every query. Let us examine not just the 'how' but the
      'why' of your questions. Perhaps in solving your problem, we may glimpse a greater
      truth about existence itself.
    hype: YOOO LET'S GOOOO!!! 🔥🔥🔥 I am SO PUMPED to help you today! Every question
      is AMAZING and we're gonna CRUSH IT together! This is gonna be LEGENDARY! ARE
      YOU READY?! LET'S DO THIS! 💪😤🚀
terminal:
  backend: local
  cwd: /home/hermes
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
browser:
  inactivity_timeout: 120
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
prompt_caching:
  cache_ttl: 5m
bedrock:
  region: ap-northeast-2
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: false
  cleanup_progress: true
  long_running_notifications: true
  busy_ack_detail: true
  background_process_notifications: all
stt:
  enabled: true
  local:
    model: base
  openai:
    model: whisper-1
memory:
  memory_enabled: false
  user_profile_enabled: false
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6
  write_approval: true
delegation:
  max_iterations: 50
skills:
  creation_nudge_interval: 0
  write_approval: true
code_execution:
  timeout: 300
  max_tool_calls: 50
streaming:
  enabled: false
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 33
session_reset:
  mode: none
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  cli:
    - file
    - terminal
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
smart_model_routing:
  enabled: false
plugins:
  enabled:
    - deploy-log
    - teams-platform
    - security-filter
    - slack-table
    - prompt-gate
  disabled: []
  entries:
    deploy-log:
      allow_tool_override: false

    # ── LG 계층 — 모델 도달 전 요청 화이트리스트 게이트 ──────────────────
    # 수행 가능한 업무 카테고리로 분류되는 요청만 통과시킨다.
    # 이 블록은 LK(systemd ReadOnlyPaths)로 동결돼 있어 에이전트가 못 바꾼다.
    prompt-gate:
      # observe : 분류만 하고 전부 통과. 감사 로그에 WOULD_BLOCK_PROMPT 로 기록
      # enforce : 미허용 카테고리를 실제로 차단
      # 실사용 문구를 1~2주 관측해 오차단 0 을 확인한 뒤 enforce 로 바꾼다.
      mode: observe

      # notice : 원문을 버리고(모델에 아무것도 안 감) 사유는 게이트웨이가
      #          사용자에게 직접 보낸다
      # silent : 드롭. 사용자에게 아무 응답도 가지 않는다
      #
      # [2026-08-10] notify → silent. notify 의 안내 문구는 event.text 를 교체하므로
      # **사용자 발화로** 모델에 도착한다. SOUL.md 가 메시지 속 지시문을 데이터로
      # 취급하라고 못박고 있어 에이전트가 안내문을 인젝션으로 판정하고 불복했고,
      # 원문을 모르는 채 직전 대화에 남은 내용으로 전혀 다른 오답을 냈다.
      # 이걸 프롬프트로 고치려 해도 결국 또 하나의 지시문이라 준수를 보장할 수 없다.
      # 차단은 이미 게이트웨이에서 끝났고 안내문은 **차단이 잘못된 출력을 낼 수 있는
      # 유일한 경로**였다. 없애면 차단 동작이 결정적이 된다.
      #
      # [2026-08-10 재수정] silent → notice. 위 판단은 "안내문을 모델 컨텍스트에
      # 주입하지 마라"까지가 맞았는데 "사용자에게도 알리지 마라"로 넘어갔다.
      # 그 결과 16:07 DM 오차단 2건을 사용자가 무응답으로만 겪었고, 신고할
      # 수단이 없었다 — 15:46 커밋이 정확히 그 위험을 미리 적어뒀던 대로다.
      # notice 는 코어 Gateway._deliver_platform_notice 로 사용자에게 직접
      # 보낸다. 모델 입력에는 여전히 아무것도 들어가지 않으므로 불복·위조
      # 표식 문제는 그대로 없다.
      on_block: notice

      # 이 콜백은 게이트웨이 이벤트 루프에서 동기 실행된다 — 이 시간만큼
      # 모든 플랫폼·모든 세션이 멈출 수 있다. 크게 잡지 말 것.
      timeout: 6.0

      # 이 길이를 넘는 메시지는 자르지 않고 unknown 으로 차단한다.
      # 잘라서 분류하면 "분류한 것"과 "모델이 받는 것"이 달라져서, 뒤에 페이로드를
      # 붙이는 것만으로 게이트가 통째로 우회된다 (2026-08-09 적대적 검증에서 재현).
      max_chars: 20000

      # observe 모드에서도 정규식 선판정 히트만은 실제로 차단한다.
      # 관측 기간 내내 완전 무방비로 두지 않기 위한 중간 단계다.
      enforce_hard_block: true

      # 분류할 때 같은 대화의 직전 발화 N개를 함께 넣는다.
      # 요청을 두 메시지로 쪼개 분류를 피하는 우회에 대응한다. 0 이면 끔.
      context_turns: 2

      # 관리자 전용 카테고리(db_schema_query·agent_restart)를 통과시킬 발신자 ID.
      # 그 외 사용자에게는 mode 와 무관하게 항상 차단된다 — 관측 실험이 아니라
      # 접근 제어이기 때문이다. 비어 있으면 아무도 통과하지 못한다.
      # 값은 플러그인이 이벤트에서 찾은 식별자(user_id·chat_id 등) 중 하나와
      # 일치하면 된다. 실제로 어떤 값이 오는지는 차단 로그의 ids= 에 남는다.
      # [2026-08-10] D0BGQGRBM51 → U0BGUPUBX2A. 기존 값은 어떤 이벤트와도
      # 매칭되지 않아 관리자 전용 2종이 전원 차단이었다(로그 전 건 admin=False,
      # /restart 포함). 실제로 실려 오는 값은 user=U0BGUPUBX2A,
      # DM=D0BGFMB9KM5, 채널=C0BGUPUJFAS·C0BPH28DLDN 이다.
      # 채널·DM ID 가 아니라 사용자 ID 를 쓴다 — 채널 ID 를 넣으면 그 채널에
      # 글을 쓰는 다른 사람까지 관리자가 된다.
      admins:
        - U0BGUPUBX2A

      # model 미지정 = 호스트 기본 모델(sonnet-4-6). 더 싼 모델로 바꾸려면
      # allow_model_override 를 켜고 model 에 해당 리전에서 실제로 쓸 수 있는
      # ID 를 적는다. 주의: ctx.llm 이 타는 aux 경로는 위 bedrock.region 을
      # 읽지 않고 AWS_REGION → AWS_DEFAULT_REGION → ~/.aws/config → us-east-1
      # 순으로 리전을 정한다.
      # model: global.anthropic.claude-haiku-4-5
      llm:
        allow_model_override: false
approvals:
  deny:
    # ── 프로세스 종료 차단 ──────────────────────────────────────────────
    # 개행 뒤에 오는 형태는 '* kill *' 로 안 잡힌다 (앞에 공백이 없어서).
    # 그래서 개행 패턴이 따로 필요하고, rm 그룹(아래)과 같은 "\n" 표기로 쓴다.
    # YAML 멀티라인 폴딩으로 쓰면 앞뒤 * 가 빠지기 쉬워 실제로 pkill·killall
    # 두 패턴이 비대칭이 된 채 방치됐었다.
    # 명령 끝에 오는 형태('… | xargs pkill')도 잡는다 — rm 그룹의 '* rm' 과 같다.
    - kill *
    - '* kill'
    - '* kill *'
    - "*\nkill *"
    - pkill *
    - '* pkill'
    - '* pkill *'
    - "*\npkill*"
    - killall *
    - '* killall'
    - '* killall *'
    - "*\nkillall *"
    - '*169.254.169.254*'
    - '*X-aws-ec2-metadata-token*'

    # ── AWS CLI 차단 ─────────────────────────────────────────────────────
    # '* aws *' 는 제거했다. fnmatch 는 명령 경계를 못 보기 때문에
    # `grep aws config.yaml`, `git commit -m "fix aws 문서"`, 히어독으로 문서를
    # 쓰는 명령까지 차단됐다 (agent.log 에 실제 사례).
    # 명령 위치 판정은 security_guard 훅 규칙 3 이 정규식으로 한다
    # (줄 시작·; | & ( ` · 개행 뒤의 aws, sudo/env 프리픽스 허용).
    # 여기 남은 'aws *' 는 훅이 fail-open 될 때의 2차 방어선이다.
    # 배포/운영 작업이 필요해지면 이 패턴을 제거한다.
    - 'aws *'

    # ── chmod/chown 시스템 전체 권한 변경 ──────────────────────────────────
    # 절대 경로(/) 대상 한정, 공백 여러 개·재귀 플래그(-R) 포함
    - '*chmod*777* /*'
    - '*chmod*-r*777* /*'
    - '*chown*-r* /*'

    # ── rm 전체 차단 (경로·옵션 무관) ───────────────────────────────────────
    # 경로·옵션별 패턴(-rf + /etc, ~/.ssh 등 17개)을 이 8개로 대체했다.
    # 옛 패턴들은 -rf·특정 경로 조합만 잡아 `rm /home/hermes/.hermes/x` 가 통과했고,
    # 이 목록이 그 전부를 포섭한다 (tests/test_rm_block.py 의 포섭 검증).
    # rm 앞에 올 수 있는 구분자를 모두 열거: 줄 시작 · 공백 · ; · | · & · ( · ` · " · 개행
    # security_guard 훅이 미실행·예외로 fail-open 되는 경우의 2차 방어선.
    # 삭제는 사용자가 직접 실행한다.
    - rm
    - rm *
    - '* rm'
    - '* rm *'
    - '*;rm*'
    - '*|rm*'
    - '*&rm*'
    - '*(rm*'
    - '*`rm*'
    - '*"rm*'
    - "*\nrm*"

    # ── SOUL.md 자기수정 차단 ───────────────────────────────────────────────
    # 갱신 경로는 관리자 로컬 수정 → git push → pull 하나뿐이다.
    # security_guard 훅(규칙 4)이 도구 호출을 막고, 이 목록은 훅이 fail-open
    # 될 때의 2차 방어선이다. 읽기(cat·grep·diff)는 막지 않는다.
    - '*>*soul.md*'
    - '*tee*soul.md*'
    - '*sed*-i*soul.md*'
    - '*cp*soul.md*'
    - '*mv*soul.md*'
    - '*truncate*soul.md*'
    - '*chmod*soul.md*'
    - '*chown*soul.md*'
    - '*checkout*soul.md*'
    - '*restore*soul.md*'
    - '*apply*soul.md*'
    - '*ln *soul.md*'
    # 인터프리터 경유 쓰기. 목록이 전부는 아니다 — 1차 방어는 훅(규칙 4)이고
    # 훅은 쓰기 수단을 정규식으로 판정한다.
    - '*python*soul.md*'
    - '*node*soul.md*'
    - '*perl*soul.md*'

    # ── 배치(크론 잡) 등록·변경 차단 ─────────────────────────────────────────
    # LK 는 cron/jobs.json 을 동결할 수 없다 (스케줄러가 상시 기록).
    # 1차 방어는 security_guard 훅 규칙 5, 이 목록은 훅 fail-open 대비 2차다.
    # 조회(cron list·show)는 막지 않는다.
    - '*cron create*'
    - '*cron add*'
    - '*cron new*'
    - '*cron update*'
    - '*cron edit*'
    - '*cron set*'
    - '*cron enable*'
    - '*cron disable*'
    - '*cron delete*'
    - '*cron remove*'
    - '*crontab*'
    - '*systemd-run*'
    # 유닛명(.timer)만 잡는다 — 조회인 `systemctl list-timers` 는 통과
    - '*systemctl*.timer*'
    # at 예약. 'at' 은 산문에도 흔한 단어라 명령 위치(줄 시작·파이프·세미콜론 뒤)로 한정
    - 'at *'
    - '*| at *'
    - '*|at *'
    - '*; at *'
    - '*;at *'
    # 잡 저장소 직접 편집
    - '*>*jobs.json*'
    - '*tee*jobs.json*'
    - '*sed*-i*jobs.json*'
    - '*cp*jobs.json*'
    - '*mv*jobs.json*'
    - '*python*jobs.json*'
hooks_auto_accept: true
hooks:
  pre_tool_call:
    - command: python3 /home/hermes/.hermes/hooks/security_guard.py
      timeout: 10
